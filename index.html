<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2efe8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111513" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<title>广西国控 · 笔试冲刺</title>
<!--
  加题格式（第 7 节）：在 QUESTIONS 数组末尾追加，每行一题、逗号结尾。
  { id: 唯一数字, type: 'single'|'multi'|'judge', subject: '与已有科目名完全一致',
    stem: '题干', options: ['选项A','选项B','选项C','选项D'],
    answer: [正确选项下标...], explain: '解析' }
  判断题 options 固定为 ['正确','错误']，answer 用 [0]（正确）或 [1]（错误）。
  科目列表、题量、总题数全部由数组自动计算，不要手写。
-->
<style>
  :root{
    --bg:#f2efe8;
    --bg2:#f7f4ec;
    --card:#fffdf7;
    --ink:#181d1a;
    --muted:#5c6660;
    --line:#e3ddd0;
    --line2:#d5cec0;
    --accent:#1d2c24;
    --on-accent:#f7f4ec;
    --seal:#b3282d;
    --sealText:#b3282d;
    --tagbg:#efe9db;
    --selbg:#edf1ec;
    --ok:#12683f;
    --okBg:#e8f3ec;
    --okLine:#7fb99a;
    --bad:#a4242b;
    --badBg:#fbecec;
    --badLine:#e0a3a6;
    --dockbg:rgba(242,239,232,.95);
    --toastbg:#1d2c24;
    --toastfg:#f7f4ec;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#111513;
      --bg2:#151b18;
      --card:#1a211e;
      --ink:#eef2ee;
      --muted:#a3aea7;
      --line:#2b3430;
      --line2:#3a453f;
      --accent:#dfe7e1;
      --on-accent:#121714;
      --seal:#c8353a;
      --sealText:#ff9a9a;
      --tagbg:#242c28;
      --selbg:#24302a;
      --ok:#63d59b;
      --okBg:#13291d;
      --okLine:#2f6f4c;
      --bad:#ff9a9a;
      --badBg:#331a1c;
      --badLine:#7d3b3f;
      --dockbg:rgba(17,21,19,.95);
      --toastbg:#e6ece7;
      --toastfg:#121714;
    }
  }

  *,*::before,*::after{box-sizing:border-box}
  [hidden]{display:none !important}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",sans-serif;
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    overflow-x:hidden;
    min-height:100vh;
    min-height:100dvh;
  }
  button{
    font-family:inherit;font-size:inherit;color:inherit;
    background:none;border:0;padding:0;margin:0;
    cursor:pointer;text-align:inherit;
    -webkit-tap-highlight-color:transparent;
    transition:transform .08s ease,background-color .12s ease,border-color .12s ease,opacity .12s ease;
  }
  button:active{transform:scale(.985)}
  button:disabled{opacity:.45;cursor:default}
  button:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
  h1,h2,h3,p,ul{margin:0}
  small{font-size:inherit}

  /* ============ 顶部 ============ */
  .top{
    position:sticky;top:0;z-index:30;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    padding-top:env(safe-area-inset-top);
  }
  .top-in{max-width:1120px;margin:0 auto;padding:6px 14px 8px}
  .brand{display:flex;align-items:center;gap:10px;min-height:44px}
  .seal{
    flex:0 0 auto;width:30px;height:30px;border-radius:8px;
    background:var(--seal);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:700;line-height:1;
  }
  .bt{flex:1 1 auto;min-width:0}
  .b1{font-size:15.5px;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .b2{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .foldbtn{
    flex:0 0 auto;width:44px;height:44px;border-radius:12px;
    border:1px solid var(--line);background:var(--card);
    display:flex;align-items:center;justify-content:center;
    font-size:16px;color:var(--muted);line-height:1;
  }
  .pbar{height:3px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 8px}
  .pbar i{display:block;height:100%;width:0;border-radius:99px;background:var(--seal);transition:width .18s ease}

  .ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .seg{
    flex:0 0 auto;display:flex;gap:8px;padding:3px;
    border:1px solid var(--line);border-radius:12px;background:var(--card);
  }
  .seg button{min-height:44px;padding:0 10px;border-radius:9px;font-size:14.5px;font-weight:600;color:var(--muted)}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
  .mini{
    min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:12px;
    background:var(--card);color:var(--ink);font-size:14px;font-weight:500;
    display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;
  }
  .ctrl .mini[data-act="stats"]{margin-left:auto}
  .mini.wide{width:100%;min-height:48px;font-size:15px}
  .mini.danger{color:var(--bad);border-color:var(--badLine)}

  .stats{
    display:grid;grid-template-columns:repeat(4,1fr);
    margin-top:8px;border:1px solid var(--line);border-radius:14px;
    overflow:hidden;background:var(--card);
  }
  .stat{
    min-height:48px;padding:6px 4px;text-align:center;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    border-left:1px solid var(--line);color:var(--ink);
  }
  .stat:first-child{border-left:0}
  .stat b{font-size:17px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
  .stat b i{font-style:normal;font-size:12px;font-weight:500;color:var(--muted)}
  .stat span{font-size:11px;color:var(--muted);line-height:1.2}

  .chips{
    display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .chips::-webkit-scrollbar{display:none}
  @media (max-width:767px){
    .ctrl #orderBtn{display:none}
    .chips{
      -webkit-mask-image:linear-gradient(to right,#000 0,#000 calc(100% - 22px),transparent 100%);
      mask-image:linear-gradient(to right,#000 0,#000 calc(100% - 22px),transparent 100%);
    }
  }
  .chip{
    flex:0 0 auto;min-height:44px;padding:0 13px;border-radius:12px;
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    font-size:14.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .chip small{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .chip[aria-pressed="true"] small{color:var(--bg);opacity:.72}
  .chip.wrongchip[aria-pressed="true"]{background:var(--seal);border-color:var(--seal);color:#fff}
  .chip.wrongchip[aria-pressed="true"] small{color:#fff;opacity:.8}

  /* ============ 主体 ============ */
  .wrap{
    max-width:100%;
    margin:0 auto;
    padding:10px 14px calc(102px + env(safe-area-inset-bottom));
  }
  .col-main{min-width:0}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:15px 14px;margin-top:10px;
  }
  .meta{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    font-size:12.5px;color:var(--muted);margin-bottom:10px;
  }
  .tag{
    padding:2px 8px;border-radius:7px;background:var(--tagbg);
    font-size:12px;font-weight:600;color:var(--ink);line-height:1.7;
  }
  .tag.t2{background:transparent;border:1px solid var(--line);font-weight:500;color:var(--muted)}
  .num{margin-left:auto;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .minibtn{
    min-height:44px;padding:0 10px;border:1px solid var(--line);border-radius:10px;
    background:var(--bg2);font-size:13px;color:var(--ink);line-height:1;
  }
  .state{font-size:12px;font-weight:700;padding:2px 8px;border-radius:7px;background:var(--tagbg);color:var(--muted)}
  .state.ok{background:var(--okBg);color:var(--ok)}
  .state.bad{background:var(--badBg);color:var(--bad)}

  .stem{
    font-size:17.5px;line-height:1.55;font-weight:600;
    margin:0 0 14px;overflow-wrap:anywhere;word-break:break-word;
  }
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{
    display:flex;align-items:flex-start;gap:10px;width:100%;
    min-height:56px;padding:13px;border:1.5px solid var(--line);border-radius:14px;
    background:var(--bg2);color:var(--ink);text-align:left;
  }
  .opt:active{background:var(--selbg)}
  .opt .lt{
    flex:0 0 auto;width:26px;height:26px;border-radius:8px;
    border:1px solid var(--line2);background:var(--card);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;color:var(--muted);line-height:1;
  }
  .opt .ot{flex:1 1 auto;min-width:0;font-size:16px;line-height:1.5;padding-top:1px;overflow-wrap:anywhere;word-break:break-word}
  .opt .mk{flex:0 0 auto;font-size:17px;font-weight:700;line-height:26px;padding-left:2px}
  .opt.sel{border-color:var(--accent);background:var(--selbg)}
  .opt.sel .lt{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .opt.ok{border-color:var(--okLine);background:var(--okBg)}
  .opt.ok .lt{background:var(--ok);border-color:var(--ok);color:#fff}
  .opt.ok .mk{color:var(--ok)}
  .opt.bad{border-color:var(--badLine);background:var(--badBg)}
  .opt.bad .lt{background:var(--bad);border-color:var(--bad);color:#fff}
  .opt.bad .mk{color:var(--bad)}
  .opt.dim{opacity:.52}

  .hint{margin:10px 0 0;font-size:14px;line-height:1.55;color:var(--muted)}

  .exp{
    margin-top:14px;border-radius:13px;padding:12px 13px;
    border-left:3px solid var(--ok);background:var(--okBg);
    overflow-wrap:anywhere;word-break:break-word;
  }
  .exp.bad{border-left-color:var(--bad);background:var(--badBg)}
  .exp .eh{font-size:14.5px;font-weight:700;line-height:1.5;margin-bottom:5px}
  .exp.bad .eh{color:var(--bad)}
  .exp.ok .eh{color:var(--ok)}
  .exp .eb{font-size:16px;line-height:1.65;color:var(--ink);overflow-wrap:anywhere;word-break:break-word}

  .empty{text-align:center;padding:34px 18px}
  .empty .emo{
    width:56px;height:56px;border-radius:50%;border:1.5px dashed var(--line2);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 12px;font-size:22px;color:var(--muted);
  }
  .empty h2{font-size:17px;margin:0 0 6px}
  .empty p{font-size:16px;color:var(--muted);margin:0;line-height:1.65}

  .intro h2{font-size:19px;margin:4px 0 8px}
  .intro p{font-size:16px;color:var(--muted);margin:0 0 10px;line-height:1.7}
  .intro ul{margin:0;padding-left:18px;font-size:16px;color:var(--muted);line-height:1.85}
  .kicker{font-size:12px;letter-spacing:.14em;color:var(--sealText);font-weight:700;margin-bottom:2px}

  .result{text-align:center;padding:22px 16px}
  .score{display:flex;align-items:flex-end;justify-content:center;gap:4px}
  .score .big{font-size:58px;font-weight:750;line-height:1;font-variant-numeric:tabular-nums}
  .score .unit{font-size:16px;color:var(--muted);padding-bottom:8px}
  .verdict{font-size:17px;font-weight:700;margin-top:10px}
  .rline{font-size:13.5px;color:var(--muted);margin-top:8px;line-height:1.6}
  .rbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:14px auto 7px;max-width:320px}
  .rbar i{display:block;height:100%;border-radius:99px;background:var(--seal)}
  .rsub{font-size:12.5px;color:var(--muted)}

  /* ============ 底部操作条 ============ */
  .dock{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:var(--dockbg);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  }
  .dock-in{max-width:1120px;margin:0 auto;display:flex;gap:10px}
  .btn{
    flex:0 0 auto;min-height:52px;padding:0 16px;border-radius:14px;
    font-size:16px;font-weight:600;line-height:1.2;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
  }
  .btn.primary{flex:1 1 auto;min-width:0;background:var(--accent);color:var(--on-accent)}
  .btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
  .btn:disabled{opacity:.35}

  /* ============ 弹层 ============ */
  .sheet{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center}
  .sheet .mask{position:absolute;inset:0;background:rgba(9,13,11,.44)}
  .panel{
    position:relative;width:100%;max-width:560px;max-height:86vh;max-height:86dvh;overflow:auto;
    background:var(--card);border-radius:20px 20px 0 0;
    padding:14px 16px calc(18px + env(safe-area-inset-bottom));
    animation:sheetUp .2s ease both;
    -webkit-overflow-scrolling:touch;
  }
  @keyframes sheetUp{from{transform:translateY(16px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .phead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .phead h3{font-size:17px;font-weight:700;flex:1 1 auto;min-width:0}
  .closebtn{
    flex:0 0 auto;min-height:44px;padding:0 12px;border:1px solid var(--line);
    border-radius:11px;font-size:14px;color:var(--muted);display:flex;align-items:center;
  }
  .overview{
    display:grid;grid-template-columns:repeat(4,1fr);
    border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-bottom:14px;
  }
  .ov{padding:9px 4px;text-align:center;border-left:1px solid var(--line)}
  .ov:first-child{border-left:0}
  .ov b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
  .ov span{font-size:11px;color:var(--muted)}
  .srow{padding:7px 0;border-bottom:1px solid var(--line)}
  .srow:last-child{border-bottom:0}
  .st{display:flex;align-items:baseline;gap:8px;font-size:14.5px;margin-bottom:5px}
  .st .sp{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
  .sbar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
  .sbar i{display:block;height:100%;border-radius:99px;background:var(--seal);transition:width .2s ease}
  .sm{font-size:11.5px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
  .pactions{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:10px}
  .sheetp{font-size:16px;line-height:1.7;color:var(--ink);margin:4px 0 6px}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:6px 0 16px}
  .cell{
    min-height:44px;border:1px solid var(--line);border-radius:10px;
    background:var(--bg2);font-size:14px;font-variant-numeric:tabular-nums;
    display:flex;align-items:center;justify-content:center;color:var(--ink);
  }
  .cell.ans{background:var(--tagbg);border-color:var(--line2);font-weight:700}
  .cell.cur{border-color:var(--seal);color:var(--seal);font-weight:700;box-shadow:inset 0 0 0 1px var(--seal)}
  .legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:4px}
  .lg{width:12px;height:12px;border-radius:4px;border:1px solid var(--line2)}
  .lg.cur{border-color:var(--seal)}
  .lg.ans{background:var(--tagbg)}

  .toast{
    position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(8px);
    max-width:calc(100% - 32px);
    padding:10px 15px;border-radius:12px;
    background:var(--toastbg);color:var(--toastfg);
    font-size:14px;line-height:1.45;text-align:center;
    z-index:90;pointer-events:none;opacity:0;
    transition:opacity .16s ease,transform .16s ease;
    overflow-wrap:anywhere;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .fatal{
    margin:16px;padding:14px;border:1px solid var(--badLine);border-radius:14px;
    background:var(--badBg);color:var(--ink);font-size:14.5px;line-height:1.6;
    overflow-wrap:anywhere;
  }
  .noscript{margin:40px 16px;font-size:16px;text-align:center;color:var(--muted)}

  .rail{display:none}

  /* ============ 桌面 ============ */
  @media (min-width:768px){
    .top{position:static}
    .top-in{padding:10px 24px 12px}
    .wrap{
      max-width:1120px;
      padding:18px 24px 48px;
      display:grid;
      grid-template-columns:minmax(0,1fr) 340px;
      gap:28px;
      align-items:start;
    }
    .rail{display:block;min-width:0}
    .rail .sticky{position:sticky;top:18px}
    .railcard{
      background:var(--card);border:1px solid var(--line);border-radius:16px;
      padding:16px;margin-bottom:14px;
    }
    .railcard h3{font-size:14px;font-weight:700;margin-bottom:6px}
    .railcard .sm{font-size:12px}
    .foot{font-size:11.5px;color:var(--muted);line-height:1.6;padding:0 2px}
    .dock{
      position:static;background:none;border:0;padding:16px 0 0;
      -webkit-backdrop-filter:none;backdrop-filter:none;
    }
    .dock-in{max-width:none}
    .chips{flex-wrap:wrap;overflow:visible}
    .card{padding:22px 24px;margin-top:12px}
    .stem{font-size:18px}
    .stat{min-height:54px}
    .toast{bottom:28px}
    .grid{grid-template-columns:repeat(10,1fr)}
  }

  /* ============ 简答与速记 ============ */
  .tabs{display:flex;gap:8px;margin-top:10px}
  .tab{
    flex:1 1 0;min-height:44px;padding:0 10px;border:1px solid var(--line);border-radius:12px;
    background:var(--card);color:var(--muted);font-size:14.5px;font-weight:600;
    display:flex;align-items:center;justify-content:center;white-space:nowrap;
  }
  .tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .qa .kicker{margin-bottom:6px}
  .qa .stem{margin-bottom:10px}
  .qaAns{margin-top:14px;border-radius:13px;border:1px solid var(--line);background:var(--bg2);padding:13px}
  .qaH{font-size:14px;font-weight:700;color:var(--sealText);margin-bottom:8px}
  .qaOl{margin:0;padding-left:20px;font-size:16px;line-height:1.7;overflow-wrap:anywhere}
  .qaOl li{margin-bottom:7px}
  .qaKey{margin-top:10px;padding:9px 10px;border-radius:10px;background:var(--tagbg);font-size:15px;line-height:1.6;overflow-wrap:anywhere}
  .revealBtn{
    width:100%;min-height:48px;margin-top:14px;border-radius:13px;
    border:1px dashed var(--line2);background:var(--bg2);color:var(--ink);
    font-size:15.5px;font-weight:600;
  }
  .ncard{padding:14px 14px 4px}
  .ngh{font-size:14px;font-weight:700;margin:0 0 2px;color:var(--sealText)}
  .nhead{display:none}
  .nrow{display:block;padding:10px 0;border-top:1px solid var(--line)}
  .nhead + .nrow{border-top:0}
  .nc{display:block;font-size:16px;line-height:1.6;overflow-wrap:anywhere;margin-top:3px}
  .nc::before{content:attr(data-l) "：";font-size:12px;color:var(--muted);margin-right:3px}
  .nc.c1{font-weight:700;margin-top:0}
  .nc.c2{font-weight:700;color:var(--sealText)}
  @media (min-width:768px){
    body[data-appmode="short"] .wrap{display:block;max-width:900px}
    body[data-appmode="short"] .rail{display:none}
    .ncard{padding:20px 22px 6px}
    .nhead{
      display:grid;grid-template-columns:1.15fr .7fr 1.3fr 1.5fr;gap:12px;
      padding:6px 8px 8px;font-size:12px;color:var(--muted);font-weight:700;

    { id:146, type:'single', subject:'电工基础', stem:'电容 C = 100μF 接在 50Hz 电源上，其容抗约为（ ）。', options:['31.8Ω','15.9Ω','63.7Ω','3.18Ω'], answer:[0], explain:'容抗 XC = 1/(2πfC) = 1/(2 × 3.14 × 50 × 100 × 10⁻⁶) ≈ 31.8Ω。容抗与频率成反比，频率升高容抗减小。' },
    { id:147, type:'single', subject:'电工基础', stem:'R = 10kΩ 与 C = 100μF 串联，其充电时间常数约为（ ）。', options:['1s','0.1s','10s','0.001s'], answer:[0], explain:'时间常数 τ = RC = 10 × 10³ × 100 × 10⁻⁶ = 1s。工程上经过 3τ~5τ 认为充电基本结束，τ 越大充电越慢。' },
    { id:148, type:'single', subject:'电工基础', stem:'某负载的有功功率为 6kW、无功功率为 8kvar，其功率因数为（ ）。', options:['0.6','0.8','0.75','1.0'], answer:[0], explain:'视在功率 S = √(P² + Q²) = √(6² + 8²) = 10kVA，功率因数 cosφ = P/S = 6/10 = 0.6。把有功与无功直接相除得到 0.75，是概念错误。' },
    { id:149, type:'single', subject:'电工基础', stem:'一台变压器额定容量 100kVA，铁损 1kW，额定负载时铜损 2kW，负载功率因数 0.8，其额定负载下的效率约为（ ）。', options:['96.4%','97.6%','95.2%','98.5%'], answer:[0], explain:'额定输出有功 P2 = 100 × 0.8 = 80kW，η = P2/(P2 + PFe + PCu) = 80/(80 + 1 + 2) ≈ 96.4%。铁损由空载试验测定，铜损由短路试验测定。' },
    { id:150, type:'single', subject:'电工基础', stem:'RLC 串联电路中，电阻上电压为 30V、电感上电压为 40V、电容上电压为 0，则总电压为（ ）。', options:['50V','70V','10V','35V'], answer:[0], explain:'串联总电压 U = √(UR² + (UL − UC)²) = √(30² + 40²) = 50V。各元件电压存在相位差，不能直接相加，70V 就是直接相加的错误结果。' },
    { id:151, type:'multi', subject:'电工基础', stem:'关于感抗和容抗，下列说法正确的有（ ）。', options:['感抗 XL = 2πfL，与频率成正比','容抗 XC = 1/(2πfC)，与频率成反比','直流稳态下电感相当于短路，电容相当于开路','电容的容抗随频率升高而增大'], answer:[0,1,2], explain:'感抗随频率升高而增大，容抗随频率升高而减小；直流稳态时电感感抗为零相当于短路，电容容抗无穷大相当于开路。选项「电容的容抗随频率升高而增大」把容抗与感抗的规律弄反了。' },
    { id:152, type:'multi', subject:'电工基础', stem:'关于电容的充电过程，下列说法正确的有（ ）。', options:['电容两端电压不能突变，只能按指数规律逐渐上升','刚接通电源瞬间充电电流最大，随后逐渐减小','充电达到稳态后电容相当于开路，电流为零','电容充电时电压随时间按直线规律上升'], answer:[0,1,2], explain:'电容电压按指数规律变化、不能突变；初始瞬间电压为零、电流最大，稳态后电压等于电源电压、电流为零。选项「电容充电时电压随时间按直线规律上升」错。' },
    { id:153, type:'judge', subject:'电工基础', stem:'变压器可以同时改变交流电压、电流和频率。（ ）', options:['正确','错误'], answer:[1], explain:'变压器只能按变比改变电压和电流，频率由电源决定，变压器不能改变频率，所以题述错误。' },
    { id:154, type:'single', subject:'电工基础', stem:'变压器空载时，一次侧电流主要用于（ ）。', options:['建立主磁通（励磁）','全部转化为铜损','输出给二次侧负载','提高功率因数'], answer:[0], explain:'空载时二次侧开路，一次侧电流主要用来建立主磁通，其损耗近似为铁损；铜损只有带负载时才明显。' },
    /* ---------- 追加 · E_batch2 · 工厂供配电 10 ---------- */
    { id:155, type:'single', subject:'工厂供配电', stem:'某车间有功计算负荷为 120kW，功率因数 0.8，其无功计算负荷约为（ ）。', options:['90kvar','96kvar','75kvar','150kvar'], answer:[0], explain:'cosφ = 0.8 时 tanφ = 0.75，无功计算负荷 Q = P·tanφ = 120 × 0.75 = 90kvar。视在功率 S = P/cosφ = 150kVA，不要与无功功率混淆。' },
    { id:156, type:'single', subject:'工厂供配电', stem:'某 10kV 母线发生三相短路，短路回路每相总阻抗为 2Ω，三相短路电流周期分量有效值约为（ ）。', options:['2.9kA','5.0kA','1.7kA','0.29kA'], answer:[0], explain:'三相短路电流 I = U线/(√3·Z) = 10000/(1.732 × 2) ≈ 2887A ≈ 2.9kA。若漏掉 √3 会得到 5.0kA，是常见错误。' },
    { id:157, type:'single', subject:'工厂供配电', stem:'电流互感器变比为 100/5，一次侧实际电流为 80A，二次侧电流表读数约为（ ）。', options:['4A','5A','1.6A','0.8A'], answer:[0], explain:'变比 100/5 = 20，二次电流 I2 = I1/20 = 80/20 = 4A。二次侧额定电流一般为 5A 或 1A。' },
    { id:158, type:'single', subject:'工厂供配电', stem:'零序电流保护主要用来反映（ ）。', options:['单相接地故障','三相对称短路','两相相间短路','电动机过负荷'], answer:[0], explain:'中性点直接接地系统发生单相接地时，故障电流经大地返回中性点，三相电流之和不为零，出现零序电流，零序保护据此动作；三相对称短路没有零序分量。' },
    { id:159, type:'single', subject:'工厂供配电', stem:'变电所采用单母线分段接线，其主要优点是（ ）。', options:['一段母线故障或检修时，另一段母线可继续供电，提高供电可靠性','可以取消所有断路器','使短路电流增大','不需要设置继电保护'], answer:[0], explain:'单母线分段用分段断路器或隔离开关把母线分成两段，重要负荷可从两段分别取得电源，一段检修或故障时另一段仍能运行；它不能取消断路器，也不能省去继电保护。' },
    { id:160, type:'single', subject:'工厂供配电', stem:'按电能质量要求，10kV 三相供电电压的允许偏差一般为额定电压的（ ）。', options:['±7%','±5%','±10%','±2%'], answer:[0], explain:'GB/T 12325 规定：35kV 及以上供电电压正、负偏差绝对值之和不超过 10%，10kV 及以下三相供电电压偏差为 ±7%，220V 单相为 +7%、−10%。' },
    { id:161, type:'multi', subject:'工厂供配电', stem:'关于工厂防雷，下列说法正确的有（ ）。', options:['避雷针用于保护露天配电装置和建筑物，使其免遭直击雷','避雷器与被保护设备并联，过电压时导通泄流','防雷接地是防雷装置的重要组成部分','装设避雷针后，被保护设备就不需要再装避雷器'], answer:[0,1,2], explain:'避雷针防直击雷，避雷器防雷电侵入波，两者作用不同，不能互相代替；防雷装置必须可靠接地才能泄放雷电流。选项「装设避雷针后，被保护设备就不需要再装避雷器」错。' },
    { id:162, type:'multi', subject:'工厂供配电', stem:'改善工厂供电电压质量的措施包括（ ）。', options:['合理增大导线截面，减小线路电压损失','合理配置无功补偿，减少无功电流引起的电压降','采用变压器分接头或有载调压调整电压','提高电网频率来升高电压'], answer:[0,1,2], explain:'电压偏差主要与线路电压损失、无功潮流和变压器分接头有关，合理增大导线截面、合理配置无功补偿、采用变压器分接头或有载调压都是常用措施；频率由电网统一决定，不能靠提高频率调压。选项「提高电网频率来升高电压」错。' },
    { id:163, type:'single', subject:'工厂供配电', stem:'TN-C 系统中 PEN 线一旦断线，三相不对称负载的中性点会（ ）。', options:['发生位移，负载中性点对地出现电压，设备外壳可能带电','保持零电位，不影响设备','使三相电压更对称','自动被断路器切除'], answer:[0], explain:'PEN 线兼作保护线，断线后中性点位移，各相电压严重不对称，外壳通过 PEN 线带上危险电压；因此 PEN 线上严禁装设开关和熔断器，并应做重复接地。' },
    { id:164, type:'judge', subject:'工厂供配电', stem:'独立避雷针的接地装置宜与被保护设备的接地装置分开敷设，以防雷击时发生反击。（ ）', options:['正确','错误'], answer:[0], explain:'雷击时独立避雷针接地装置电位很高，若与被保护设备接地装置相连或距离过近，可能向设备放电造成反击，因此两者应分开敷设并保持足够距离。' },
    /* ---------- 追加 · E_batch2 · 电机与电气控制 10 ---------- */
    { id:165, type:'single', subject:'电机与电气控制', stem:'三相异步电动机在稳定运行区内，负载转矩增大时，电动机的转速将（ ）。', options:['下降，定子电流增大','上升，定子电流减小','保持不变，电流也不变','先上升后下降'], answer:[0], explain:'稳定区内负载增大使转子减速、转差率增大，转子电流和定子电流随之增大，电磁转矩增大到与负载平衡；转速下降是电动机自动适应负载的表现。' },
    { id:166, type:'single', subject:'电机与电气控制', stem:'变频调速的实质是（ ）。', options:['改变定子供电频率，从而改变同步转速，实现无级调速','改变定子绕组极对数','在转子回路串入电阻','改变电源相序'], answer:[0], explain:'由 n1 = 60f/p 可知，改变频率即可连续改变同步转速，调速范围宽、效率高；变极调速是有级调速，转子串电阻主要用于绕线式电动机。' },
    { id:167, type:'single', subject:'电机与电气控制', stem:'能耗制动过程中，制动转矩随转速下降而（ ）。', options:['逐渐减小，转速降到零时制动转矩也为零','逐渐增大','保持不变','先减小后增大'], answer:[0], explain:'能耗制动把定子绕组接入直流电源，转子切割静止磁场产生制动转矩，转速越低制动转矩越小，停转后自动消失；它比反接制动平稳，但需要直流电源。' },
    { id:168, type:'single', subject:'电机与电气控制', stem:'交流接触器线圈通电后不吸合，最先应检查（ ）。', options:['线圈是否断路、控制回路是否接通以及线圈电压是否过低','主触点是否烧毛','灭弧罩是否装好','电动机是否过载'], answer:[0], explain:'线圈不吸合说明控制回路或线圈本身有问题，应先测线圈电阻、查控制回路熔断器和按钮触点、核对线圈电压；主触点、灭弧罩和电动机过载都不会导致线圈不吸合。' },
    { id:169, type:'single', subject:'电机与电气控制', stem:'电动机运行中轴承温度过高，下列原因中最不可能的是（ ）。', options:['电源频率偏低','润滑脂不足或变质','轴承磨损、间隙过大','轴承装配过紧或联轴器对中不良'], answer:[0], explain:'轴承过热主要来自润滑、轴承本身和装配对中问题；电源频率偏低影响的是转速和磁通，不会直接造成轴承温度升高。' },
    { id:170, type:'single', subject:'电机与电气控制', stem:'某 PLC 定时器的时基为 100ms，设定值为 50，其延时时间为（ ）。', options:['5s','0.5s','50s','0.05s'], answer:[0], explain:'延时时间 = 时基 × 设定值 = 100ms × 50 = 5000ms = 5s。时基为 10ms 时，同样的设定值才是 0.5s。' },
    { id:171, type:'single', subject:'电机与电气控制', stem:'变频器在基频以上继续升高频率时，输出电压保持额定值不变，电动机进入（ ）。', options:['恒功率调速区（弱磁调速）','恒转矩调速区','恒磁通调速区','恒转差率调速区'], answer:[0], explain:'基频以下保持 U/f 恒定，磁通基本不变，属恒转矩调速；基频以上电压不能超过额定值，磁通随频率升高而减弱，输出功率基本不变，属恒功率（弱磁）调速。' },
    { id:172, type:'multi', subject:'电机与电气控制', stem:'三相异步电动机常用的调速方法有（ ）。', options:['改变定子绕组极对数','改变定子供电频率','绕线式电动机转子回路串电阻','改变电源相序'], answer:[0,1,2], explain:'变极、变频和转子串电阻都能改变电动机的稳定转速；改变电源相序只能使电动机反转，不能调节转速。选项「改变电源相序」错。' },
    { id:173, type:'judge', subject:'电机与电气控制', stem:'三相异步电动机的电气制动方法包括能耗制动、反接制动和回馈制动。（ ）', options:['正确','错误'], answer:[0], explain:'能耗制动接通直流电源，反接制动改变相序，回馈制动使电动机转速高于同步转速、向电网回馈电能，三者都是常用的电气制动方式。' },
    { id:174, type:'judge', subject:'电机与电气控制', stem:'接触器具有失压保护作用，电源电压消失后其主触点自动断开，恢复供电时电动机不会自行启动。（ ）', options:['正确','错误'], answer:[0], explain:'接触器线圈失电后衔铁在弹簧作用下释放，主触点断开；只要不重新按下启动按钮，电动机不会自行启动，这就是失压（零压）保护。' },
    /* ---------- 追加 · E_batch2 · 电子技术 8 ---------- */
    { id:175, type:'single', subject:'电子技术', stem:'二极管钳位电路的主要作用是（ ）。', options:['把信号的顶部或底部钳制在某一固定直流电平上，基本不改变波形形状','把正弦波变成方波','把交流电变成直流电','把直流电变成交流电'], answer:[0], explain:'钳位电路利用二极管和电容把整个波形上下平移，使顶部或底部固定在指定电平，波形形状不变；整流才是把交流变成直流。' },
    { id:176, type:'single', subject:'电子技术', stem:'分压式偏置共射放大电路中，发射极电阻 Re 的主要作用是（ ）。', options:['引入直流负反馈，稳定静态工作点','提高电源电压','增大集电极电阻','使三极管工作在饱和区'], answer:[0], explain:'Re 上的直流压降随集电极电流增大而增大，反过来使 UBE 减小，从而稳定静态工作点、减小温度漂移；它不改变电源电压，也不应让管子进入饱和区。' },
    { id:177, type:'single', subject:'电子技术', stem:'共射放大电路 VCC = 12V，集电极电阻 RC = 3kΩ，集电极电流 IC = 2mA，忽略发射极电阻压降，则 UCE 约为（ ）。', options:['6V','12V','4V','2V'], answer:[0], explain:'UCE = VCC − IC·RC = 12 − 2 × 3 = 6V。若忽略 RC 上的压降会误得 12V，把 IC·RC 误算成 8V 则误得 4V。' },
    { id:178, type:'single', subject:'电子技术', stem:'某同相比例运算电路要求电压放大倍数为 10，已知反馈电阻 Rf = 90kΩ，则电阻 R1 应取（ ）。', options:['10kΩ','9kΩ','90kΩ','100kΩ'], answer:[0], explain:'同相比例放大 Auf = 1 + Rf/R1，即 10 = 1 + 90/R1，解得 R1 = 10kΩ；若漏掉同相放大的“1”、按 Rf/R1 = 10 计算，会误得 9kΩ。' },
    { id:179, type:'single', subject:'电子技术', stem:'晶闸管由导通转为关断的条件是（ ）。', options:['阳极电流减小到维持电流以下，或阳极与阴极之间加反向电压','门极电流增大到一定值','门极加反向电压','阳极电压升高'], answer:[0], explain:'晶闸管导通后门极失去控制作用，只能靠主电路电流降到维持电流以下或承受反压关断；门极信号只负责触发导通。' },
    { id:180, type:'single', subject:'电子技术', stem:'逻辑表达式 A + AB 化简后的结果是（ ）。', options:['A','A + B','B','AB'], answer:[0], explain:'A + AB = A(1 + B) = A，因为 1 + B = 1。这是逻辑代数中的吸收律，化简结果与 B 的取值无关。' },
    { id:181, type:'multi', subject:'电子技术', stem:'关于运放线性应用中的虚短、虚地与放大倍数，下列说法正确的有（ ）。', options:['深度负反馈下两输入端电位近似相等，即虚短','反相比例电路中反相输入端近似为虚地','同相比例放大的电压倍数为 1 + Rf/R1','运放的输出电压可以超过其电源电压'], answer:[0,1,2], explain:'线性应用靠深度负反馈建立虚短、虚断，反相端电位近似为零称为虚地；输出电压受电源电压限制，不可能超过电源电压。选项「运放的输出电压可以超过其电源电压」错。' },
    { id:182, type:'judge', subject:'电子技术', stem:'分压式偏置电路中，发射极旁路电容 Ce 对交流相当于短路，可提高交流电压放大倍数。（ ）', options:['正确','错误'], answer:[0], explain:'Ce 对交流容抗很小，把 Re 交流旁路，使交流负反馈减小，电压放大倍数提高；但它不影响直流偏置，静态工作点仍由 Re 稳定。' },
    /* ---------- 追加 · E_batch2 · 电气安全 10 ---------- */
    { id:183, type:'single', subject:'电气安全', stem:'我国安全电压的额定值系列不包括（ ）。', options:['18V','42V','24V','6V'], answer:[0], explain:'我国安全电压额定值系列为 42、36、24、12、6V，18V 不在系列内；选用时应根据场所潮湿程度和触电危险性确定。' },
    { id:184, type:'single', subject:'电气安全', stem:'保护接零与保护接地的主要区别是（ ）。', options:['保护接零把设备外壳接到 PE 线或 PEN 线，保护接地把外壳接到独立的接地装置','两者完全一样','保护接零把外壳接到相线','保护接地把外壳接到中性线'], answer:[0], explain:'保护接零用于 TN 系统，外壳接 PE 或 PEN 线，依靠单相短路使保护电器迅速动作；保护接地用于 TT 或 IT 系统，外壳接独立接地体，靠降低外壳对地电压来减轻触电危险。' },
    { id:185, type:'single', subject:'电气安全', stem:'低压线路和设备的绝缘电阻一般不应低于（ ）。', options:['0.5MΩ','0.05MΩ','5MΩ','50MΩ'], answer:[0], explain:'低压线路和设备冷态绝缘电阻一般要求不低于 0.5MΩ，测量时使用兆欧表并先切断电源、充分放电；低于该值应查明原因并干燥处理。' },
    { id:186, type:'single', subject:'电气安全', stem:'二氧化碳灭火器最适用于扑救（ ）。', options:['带电设备、精密仪器和电子设备的火灾','金属钠、钾等活泼金属火灾','大面积油类流淌火灾','人体衣物着火'], answer:[0], explain:'二氧化碳不导电、灭火后不留痕迹，适合带电设备和精密仪器；活泼金属火灾需用专用干粉，二氧化碳对其无效，人体着火更不能直接喷射。' },
    { id:187, type:'single', subject:'电气安全', stem:'安全色中，红色表示（ ）。', options:['禁止、停止','指令、必须遵守','警告、注意','安全、通行'], answer:[0], explain:'安全色规定：红色表示禁止、停止，蓝色表示指令、必须遵守，黄色表示警告、注意，绿色表示安全、通行。' },
    { id:188, type:'single', subject:'电气安全', stem:'静电的主要危害是（ ）。', options:['可能引发火灾爆炸、造成电击和妨碍生产','提高设备绝缘水平','降低线路损耗','对人和设备都没有危害'], answer:[0], explain:'静电电压可达数千伏，放电火花可能点燃可燃气体或粉尘，也会给人电击感并干扰电子设备；因此易燃场所要做好接地、增湿和防静电措施。' },
    { id:189, type:'single', subject:'电气安全', stem:'对无呼吸、无心跳的触电者进行心肺复苏前，应首先（ ）。', options:['将其仰卧在坚固平面上，头后仰、清除口鼻异物，保持气道通畅','让其坐起并喂水','立即注射药物','先做人工呼吸 10 分钟再按压'], answer:[0], explain:'心肺复苏的第一步是开放气道：仰卧在硬平面上、头后仰、清除口鼻异物，然后按 30:2 进行胸外按压和人工呼吸；喂水或先注射药物都会耽误抢救。' },
    { id:190, type:'multi', subject:'电气安全', stem:'预防电气火灾的措施包括（ ）。', options:['合理选择导线截面和保护电器，避免线路长期过载','保持设备通风散热，防止绝缘受潮老化','定期检查接头、触点和绝缘状况','用铜丝代替熔丝以增大载流能力'], answer:[0,1,2], explain:'电气火灾多由过载、接触不良、绝缘老化和散热不良引起，合理选择导线截面和保护电器、保持设备通风散热、定期检查接头触点和绝缘状况都是有效措施；用铜丝代替熔丝会失去过流保护，是严重违章。选项「用铜丝代替熔丝以增大载流能力」错。' },
    { id:191, type:'multi', subject:'电气安全', stem:'防止静电危害的常用措施有（ ）。', options:['设备、管道可靠接地以泄放静电','增加环境湿度，减少静电积聚','在易燃场所使用防静电材料和防静电工作服','穿化纤衣物并快速摩擦以中和静电'], answer:[0,1,2], explain:'接地、增湿和使用防静电材料是防静电的基本措施；化纤衣物容易产生并积聚静电，摩擦只会加剧。选项「穿化纤衣物并快速摩擦以中和静电」错。' },
    { id:192, type:'judge', subject:'电气安全', stem:'安全电压是绝对安全的，人体接触安全电压范围内的带电体不会发生任何危险。（ ）', options:['正确','错误'], answer:[1], explain:'安全电压只是相对降低了触电危险，潮湿、长时间接触或人体电阻很低时仍可能造成伤害，仍需绝缘、屏护等防护措施，所以题述“绝对安全”错误。' },

    { id:193, type:'single', subject:'集团背景与企业文化', stem:'广西国控的品牌推广语是（ ）。', options:['聚资强国 创利惠民','战略保障、资本运作、产业引领','全国一流资本运营标杆','全国一流食品产业集团'], answer:[0], explain:'品牌推广语为“聚资强国 创利惠民”，与战略使命的表述同口径；“战略保障、资本运作、产业引领”是三大核心功能，“全国一流资本运营标杆”“全国一流食品产业集团”是两大目标。' },
    { id:194, type:'judge', subject:'集团背景与企业文化', stem:'广西国控吉祥物“国小宝”的形象为红色方块（印章形）脑袋，穿白衬衫、打领带，官方人设是“元气代言人、职场暖团子”。（ ）', options:['正确','错误'], answer:[0], explain:'国小宝的形象为红色方块（印章形）脑袋、白衬衫打领带，官方人设是“元气代言人、职场暖团子”；题干表述与官方公开口径一致。' },
    { id:195, type:'multi', subject:'集团背景与企业文化', stem:'近年来集团开展了多项职工文化活动。下列名称中，属于集团官方文化活动品牌的有（ ）。', options:['“幸福国控 你我同行”系列活动','“国控杯”广西县超','“山歌词王”线上挑战赛','“国控先锋”表彰活动'], answer:[0,1,2], explain:'集团文化活动品牌为“幸福国控 你我同行”系列活动、“国控杯”广西县超和“山歌词王”线上挑战赛；“国控先锋”表彰活动不属于集团官方公布的文化活动品牌。' }

  const SHORT_QA = [
    { id:1, subject:'电工基础', title:'功率因数补偿的计算与投切',
      stem:'昌菱制糖动力车间一条 380V 配电线路的有功计算负荷为 200kW，补偿前 cosφ₁=0.8（tanφ₁=0.75），要求补偿到 cosφ₂=0.95（tanφ₂≈0.33）。请说明补偿原理，并计算所需并联电容器的容量。',
      points:[
        '原理：感性负载建立磁场需要无功功率，并联电容器就地发出容性无功，抵消负载所需的无功，使线路输送的无功减少、功率因数提高；有功负荷本身不变。',
        '计算：Qc = P(tanφ₁ − tanφ₂) = 200 × (0.75 − 0.33) = 84 kvar。',
        '配置：按 84 kvar 选择电容器组，可分相、分组投切；电容器额定电压应与系统电压匹配，谐波较大时串联电抗器。',
        '效果：cosφ 提高后线路电流减小，线路损耗和电压损失下降，变压器等设备的容量得到释放。',
        '注意：不得过补偿造成无功倒送；投切装置应有放电回路和联锁，停电后充分放电再检修。'
      ],
      key:'采分点是公式 Qc=P(tanφ₁−tanφ₂) 和 84kvar；只写“并联电容器”不写计算最多得一半分。易错是把 P 乘以 cosφ，或用 φ₁、φ₂ 的角度差直接计算。' },

    { id:2, subject:'电工基础', title:'变压器并列运行的条件',
      stem:'糖厂变电所因榨季负荷增长，需要将一台备用变压器与运行变压器并列供电。请说明并列运行必须满足的条件，以及不满足时会有什么后果。',
      points:[
        '变比相同（允许偏差一般不超过 ±0.5%）：变比不同会在两台变压器二次侧之间产生环流，增加损耗、影响出力。',
        '连接组别相同：组别不同会使二次侧电压相位不一致，产生很大的电位差，相当于短路。',
        '短路阻抗（阻抗电压）百分数相近（一般相差不超过 10%）：否则负荷分配不均，阻抗小的一台先过载。',
        '容量比不宜相差过大（一般不超过 3:1），并确认相序一致、接线正确，并列前核相。',
        '后果：不满足上述条件轻则环流发热、负荷不均，重则保护跳闸或损坏变压器。'
      ],
      key:'变比、组别、阻抗电压三条是核心；容量“相近”即可，不是必须完全相等。易错是把“容量相同”当成硬条件，或漏掉并列前核相。' },

    { id:3, subject:'电工基础', title:'三相负载星形、三角形接法的关系',
      stem:'动力车间一台三相异步电动机铭牌标有 380V/660V、△/Y。请说明两种接法下线电压与相电压、线电流与相电流的关系，并比较同一对称负载分别作星形、三角形连接时的功率。',
      points:[
        '星形接法：U线 = √3·U相，I线 = I相；三角形接法：U线 = U相，I线 = √3·I相。',
        '同一对称负载 Z 接在同一线电压 U 上：星形时每相电压 U/√3、相电流 U/(√3Z)；三角形时每相电压 U、相电流 U/Z。',
        '功率：P = √3·U线·I线·cosφ；代入可得星形 P_Y = (U²/Z)cosφ，三角形 P_Δ = (3U²/Z)cosφ，即 P_Δ = 3P_Y。',
        '应用：Y-△ 启动正是利用“星形启动时电压、电流、转矩都降为三角形的 1/3”，启动后再切换为三角形运行。',
        '铭牌 380/660V、△/Y 表示线电压 380V 时接三角形、660V 时接星形，保证每相绕组承受的电压相同。'
      ],
      key:'两个 √3 关系和 P_Δ=3P_Y 是采分点；易错是把线电压/相电压关系与线电流/相电流关系记反，或认为星形接法功率是三角形的 3 倍（实际相反）。' },

    { id:4, subject:'工厂供配电', title:'漏电保护器的原理与选型',
      stem:'糖厂压榨车间潮湿，手持电动工具回路经常发生漏电，需要加装漏电保护器。请说明其工作原理、末级选型参数和安装注意事项。',
      points:[
        '原理：零序电流互感器检测相线与中性线电流的相量和，正常时为零；发生漏电或人身触电时，部分电流经大地返回，相量和不再为零，达到整定值即脱扣切断电源。',
        '选型：末级人身防护一般选额定动作电流不大于 30mA、动作时间不大于 0.1s；上级用于防火或分级保护可选 100~300mA 并带延时，上下级要有动作值和时间的级差。',
        '安装：PE 线不得穿过零序电流互感器；负载侧 N 线不得重复接地；漏保应装在电源侧，接线后按试验按钮试跳。',
        '配合：漏电保护是附加保护，不能代替保护接地/接零、绝缘、屏护和安全距离。',
        '适用：潮湿场所、手持电动工具、移动式设备、临时用电回路应优先设置。'
      ],
      key:'“30mA、0.1s、零序电流、PE 线不穿互感器”是关键词；易错是认为装了漏保就可以取消接地或接零。' },

    { id:5, subject:'工厂供配电', title:'停电、送电的倒闸操作顺序',
      stem:'10kV 配电室要对一台出线柜停电检修。请写出停电和送电的倒闸操作顺序，并说明操作中的关键要求。',
      points:[
        '停电：断开断路器 → 拉开负荷侧隔离开关 → 拉开电源侧隔离开关。',
        '送电：合上电源侧隔离开关 → 合上负荷侧隔离开关 → 合上断路器。',
        '操作要求：填写操作票，双人操作、一人监护；核对设备名称、编号和位置；使用合格的安全用具；严禁带负荷拉合隔离开关。',
        '停电后依次验电、装设接地线、悬挂标示牌和装设遮栏，完成后方可工作。',
        '送电前收回工作票、拆除接地线、确认人员和工具撤离、拆除临时遮栏。'
      ],
      key:'顺序和“操作票+监护”是采分点；易错是停电时先拉电源侧隔离开关，或把送电顺序写反。' },

    { id:6, subject:'工厂供配电', title:'“两票三制”与工作票的作用',
      stem:'配电员要进入 10kV 高压室对开关柜进行清扫。请说明“两票三制”的具体内容，以及工作票在作业中起什么作用。',
      points:[
        '两票：工作票、操作票。工作票是准许工作的书面命令，写明工作任务、工作地点、安全措施、工作负责人和许可时间；操作票用于倒闸操作，逐项执行并监护。',
        '三制：交接班制、巡回检查制、设备定期试验轮换制。',
        '作业流程：工作票签发 → 工作许可 → 现场安全交底 → 工作监护 → 工作终结 → 验收送电。',
        '保证安全的组织措施还包括工作许可、工作监护、工作间断/转移/终结制度；技术措施为停电、验电、装设接地线、悬挂标示牌和装设遮栏。',
        '配电员不得擅自变更安全措施或扩大工作范围，发现违章应制止并报告。'
      ],
      key:'两票、三制名称要写全，工作票“书面命令、许可”是关键词；易错是把“工作许可制度”当成三制之一。' },

    { id:7, subject:'工厂供配电', title:'短路电流的危害与限制措施',
      stem:'糖厂 10kV 母线发生三相短路，值班员听到巨响并发现母线电压骤降。请说明短路的主要危害和限制短路电流的常用措施。',
      points:[
        '热效应：短路电流可达正常电流的几十倍，短时间内产生大量热量，烧毁导体、电缆和开关设备。',
        '电动力：短路冲击电流产生很大的电动力，使母线、支持绝缘子和开关柜变形损坏。',
        '电压骤降：短路点附近电压显著降低，影响其他用户正常用电，严重时破坏系统稳定。',
        '停电与设备损坏：保护装置拒动或断路器开断能力不足时，可能造成设备爆炸和大面积停电。',
        '限制措施：合理确定系统接线和分列运行、加装限流电抗器、选用开断能力足够的开关电器、提高继电保护动作速度、及时切除故障。'
      ],
      key:'热效应、电动力、电压骤降三条再加限流措施；易错是只答“烧坏设备”，不展开电动力和电压影响。' },

    { id:8, subject:'电机与电气控制', title:'三相异步电动机启动方式的比较',
      stem:'糖厂一台 75kW 泵用三相异步电动机直接启动时启动电流过大，厂用母线电压明显下降。请比较 Y-△、自耦降压、软启动和变频启动四种方式的特点与适用条件。',
      points:[
        'Y-△ 降压启动：适用于正常运行为三角形接法、轻载启动的电动机；启动电流和启动转矩都降为直接启动的 1/3；接线简单、成本低，但切换瞬间有二次冲击。',
        '自耦降压启动：通过 65%、80% 等抽头降压，启动电流和转矩按电压的平方下降；适用于容量较大、轻载启动的场合；设备体积大，不宜频繁启动。',
        '软启动：用晶闸管调压使电压平滑上升，启动电流一般限制在额定电流的 2~4 倍，启动结束由旁路接触器短接；适合泵、风机类负载。',
        '变频启动：从低频、低压启动，启动电流小、启动转矩可控，还能实现无级调速；成本较高，适合需要调速或频繁启动的设备。',
        '选择原则：泵类轻载优先软启动或变频；只有三角形接法且轻载才用 Y-△；重载启动必须核算启动转矩是否满足。'
      ],
      key:'四种方式的电流/转矩特点和适用条件是采分点；易错是认为 Y-△ 适用于任何电机，或忽略重载启动时转矩不足。' },

    { id:9, subject:'电机与电气控制', title:'变频调速原理与变频器使用注意事项',
      stem:'动力车间一台风机改为变频器控制。请说明变频调速的基本原理，以及安装、接线、参数设置和运行维护中的主要注意事项。',
      points:[
        '原理：由 n₁=60f/p，改变供电频率即可改变同步转速；基频以下保持 U/f 恒定以维持磁通，属恒转矩调速；基频以上电压不能超过额定值，磁通减弱，属恒功率（弱磁）调速。',

    get: function () {
      if (storageOK) {
        try { return window.localStorage.getItem(STORE_KEY); } catch (e) { return memStore[STORE_KEY] || null; }
      }
      return memStore[STORE_KEY] || null;
    },
    set: function (v) {
      memStore[STORE_KEY] = v;
      if (!storageOK) return;
      try { window.localStorage.setItem(STORE_KEY, v); } catch (e) { storageOK = false; }
    },
    clear: function () {
      delete memStore[STORE_KEY];
      if (!storageOK) return;
      try { window.localStorage.removeItem(STORE_KEY); } catch (e) {}
    }

  function cleanSel(obj) {
    Object.keys(obj).forEach(function (k) {
      var q = QMAP.get(Number(k));
      if (!q || !Array.isArray(obj[k])) { delete obj[k]; return; }
      var next = [];
      obj[k].forEach(function (i) {
        i = Number(i);
        if (Number.isInteger(i) && i >= 0 && i < q.options.length && next.indexOf(i) < 0) next.push(i);
      });
      obj[k] = next.sort(function (a, b) { return a - b; });
    });
  }

  function load() {
    var raw = store.get();
    if (!raw) return;
    var s;
    try { s = JSON.parse(raw); } catch (e) { return; }
    if (!s || typeof s !== 'object') return;

    var st = blankState();
    Object.keys(st).forEach(function (k) {
      if (s[k] !== undefined) st[k] = s[k];
    });
    st.exam = Object.assign({ ids: [], answers: {}, phase: 'idle' }, s.exam && typeof s.exam === 'object' ? s.exam : {});
    st.answers = s.answers && typeof s.answers === 'object' ? s.answers : {};
    st.done = s.done && typeof s.done === 'object' ? s.done : {};
    st.hist = s.hist && typeof s.hist === 'object' ? s.hist : {};
    st.shuffle = s.shuffle && typeof s.shuffle === 'object' ? s.shuffle : {};
    st.wrong = Array.isArray(s.wrong) ? s.wrong : [];
    st.randOrder = Array.isArray(s.randOrder) ? s.randOrder : null;
    st.idx = Number.isFinite(Number(s.idx)) ? Math.max(0, Math.floor(Number(s.idx))) : 0;
    st.mode = s.mode === 'exam' ? 'exam' : (s.mode === 'short' ? 'short' : 'practice');
    st.order = s.order === 'random' ? 'random' : 'seq';
    st.subject = s.subject === '全部' || SUBJECTS.indexOf(s.subject) >= 0 ? s.subject : '全部';
    st.wrongOnly = !!s.wrongOnly;
    st.collapse = !!s.collapse;
    st.shortIdx = Number.isFinite(Number(s.shortIdx)) ? Math.max(0, Math.floor(Number(s.shortIdx))) : 0;
    st.shortIdx = Math.min(st.shortIdx, SHORT_QA.length - 1);
    st.shortOpen = s.shortOpen && typeof s.shortOpen === 'object' ? s.shortOpen : {};
    Object.keys(st.shortOpen).forEach(function (k) {
      if (!SHORT_QA.some(function (q) { return q.id === Number(k); })) delete st.shortOpen[k];
    });
    st.shortTab = s.shortTab === 'num' ? 'num' : 'qa';

    st.wrong = st.wrong.filter(function (id) { return QMAP.has(id); });
    st.exam.ids = (Array.isArray(st.exam.ids) ? st.exam.ids : []).filter(function (id) { return QMAP.has(id); });
    if (['idle', 'running', 'result', 'review'].indexOf(st.exam.phase) < 0) st.exam.phase = 'idle';
    if (!st.exam.ids.length) st.exam.phase = 'idle';
    if (!st.exam.answers || typeof st.exam.answers !== 'object') st.exam.answers = {};

    cleanSel(st.answers);
    cleanSel(st.exam.answers);
    Object.keys(st.done).forEach(function (k) { if (!QMAP.has(Number(k))) delete st.done[k]; });
    Object.keys(st.hist).forEach(function (k) { if (!QMAP.has(Number(k))) delete st.hist[k]; });
    Object.keys(st.shuffle).forEach(function (k) {
      var q = QMAP.get(Number(k));
      var p = st.shuffle[k];
      if (!q || !Array.isArray(p) || p.length !== q.options.length) delete st.shuffle[k];
    });

    state = st;
  }

  function save() {
    try { store.set(JSON.stringify(state)); } catch (e) {}
  }

  /* ===================== 工具函数 ===================== */
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (m) {
      return m === '&' ? '&amp;' : m === '<' ? '&lt;' : m === '>' ? '&gt;' : '&quot;';
    });
  }
  function shuffleArr(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function isCorrect(q, sel) {
    if (!q || !Array.isArray(sel) || sel.length !== q.answer.length) return false;
    for (var i = 0; i < q.answer.length; i++) {
      if (sel.indexOf(q.answer[i]) < 0) return false;
    }
    return true;
  }

  // 选项乱序映射：返回数组 perm，perm[显示位置] = 原始索引；同一题保持稳定
  function permFor(q) {
    if (q.type === 'judge') return [0, 1];
    var cached = state.shuffle[q.id];
    if (Array.isArray(cached) && cached.length === q.options.length) {
      var ok = true;
      for (var i = 0; i < cached.length; i++) {
        if (!Number.isInteger(cached[i]) || cached[i] < 0 || cached[i] >= q.options.length) { ok = false; break; }
      }
      if (ok) return cached;
    }
    var p = q.options.map(function (_, i) { return i; });
    shuffleArr(p);
    state.shuffle[q.id] = p;
    save();
    return p;
  }

  function subjectIds() {
    return QUESTIONS.filter(function (q) {
      return state.subject === '全部' || q.subject === state.subject;
    }).map(function (q) { return q.id; });
  }

  function orderedIds(ids) {
    if (state.order !== 'random') return ids;
    if (!Array.isArray(state.randOrder) || !state.randOrder.length) {
      state.randOrder = shuffleArr(ALL_IDS.slice());
      save();
    }
    var missing = ALL_IDS.filter(function (id) { return state.randOrder.indexOf(id) < 0; });
    if (missing.length) {
      state.randOrder = state.randOrder.concat(shuffleArr(missing));
      save();
    }
    var pos = new Map();
    state.randOrder.forEach(function (id, i) { pos.set(id, i); });
    return ids.slice().sort(function (a, b) {
      var pa = pos.has(a) ? pos.get(a) : 1e9;
      var pb = pos.has(b) ? pos.get(b) : 1e9;
      return pa - pb;
    });
  }

  function currentIds() {
    var ids = orderedIds(subjectIds());
    if (state.wrongOnly) {
      ids = ids.filter(function (id) {
        return state.wrong.indexOf(id) >= 0 || id === ui.hold;
      });
    }
    return ids;
  }

  function activeIds() {
    return state.mode === 'exam' ? state.exam.ids : currentIds();
  }

  function curIdx(ids) {
    if (!ids.length) return 0;
    return Math.min(Math.max(state.idx, 0), ids.length - 1);
  }

  function curQ() {
    var ids = activeIds();
    return QMAP.get(ids[curIdx(ids)]);
  }

  function view() {
    if (state.mode === 'short') return 'short';
    if (state.mode === 'practice') return currentIds().length ? 'quiz' : 'empty';
    var ex = state.exam;
    if (!ex.ids.length || ex.phase === 'idle') return 'examIntro';
    if (ex.phase === 'result') return 'result';
    if (ex.phase === 'review') return 'review';
    return 'examQuiz';
  }

  function examStats() {
    var c = 0, w = 0, b = 0, n = state.exam.ids.length;
    state.exam.ids.forEach(function (id) {
      var q = QMAP.get(id);
      var s = state.exam.answers[id] || [];
      if (!s.length) { b++; return; }
      if (isCorrect(q, s)) c++; else w++;
    });
    return { c: c, w: w, b: b, n: n, score: n ? Math.round(c / n * 100) : 0 };
  }

  function bumpHist(id, ok) {
    var h = state.hist[id];
    if (!h || typeof h !== 'object') h = { t: 0, c: 0 };
    h.t = (Number(h.t) || 0) + 1;
    h.c = (Number(h.c) || 0) + (ok ? 1 : 0);
    state.hist[id] = h;
  }

  function addWrong(id) {
    if (state.wrong.indexOf(id) < 0) state.wrong.push(id);
  }
  function removeWrong(id) {
    var i = state.wrong.indexOf(id);
    if (i >= 0) state.wrong.splice(i, 1);
  }

  function subjectStats(sub) {
    var total = 0, doneN = 0, t = 0, c = 0;
    QUESTIONS.forEach(function (q) {
      if (q.subject !== sub) return;
      total++;
      if (state.done[q.id]) doneN++;
      var h = state.hist[q.id];
      if (h && Number(h.t) > 0) { t += Number(h.t); c += Number(h.c) || 0; }
    });
    return { total: total, done: doneN, t: t, c: c, pct: t ? Math.round(c / t * 100) : null };
  }

  function answerText(q, perm) {
    if (q.type === 'judge') return q.answer[0] === 0 ? '正确' : '错误';
    var out = [];
    perm.forEach(function (orig, pos) {
      if (q.answer.indexOf(orig) >= 0) out.push(LETTERS.charAt(pos));
    });
    return out.sort().join('、');
  }

  function toTop() {
    try { window.scrollTo(0, 0); } catch (e) {}
  }

  function toast(msg) {
    var el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(ui.toastTimer);
    ui.toastTimer = window.setTimeout(function () { el.classList.remove('show'); }, 1900);
  }

  function fatal(msg) {
    var el = document.getElementById('fatal');
    if (!el) return;
    el.hidden = false;
    el.textContent = '页面出现异常：' + (msg || '未知错误') + '。可尝试刷新页面；本页面不依赖网络，刷新不会丢失进度。';
  }

  /* ===================== 状态操作 ===================== */
  function setMode(m) {
    if (['practice', 'exam', 'short'].indexOf(m) < 0) return;
    if (state.mode === m) return;
    state.mode = m;
    state.idx = 0;
    ui.hold = null;
    save();
    render();
    toTop();
    if (m === 'exam') {
      if (!state.exam.ids.length) toast('考试模式：先开始一场考试');
      else if (state.exam.phase === 'running') toast('已恢复未交卷的考试');
    } else if (m === 'short') {
      toast('简答模式：先想答案，再展开对照');
    } else {
      toast('已切换到练习模式');
    }
  }

  function setSubject(sub) {
    state.subject = sub;
    state.wrongOnly = false;
    state.idx = 0;
    ui.hold = null;
    save();
    render();
    toTop();
  }

  function setOrder() {
    state.order = state.order === 'seq' ? 'random' : 'seq';
    if (state.order === 'random') state.randOrder = shuffleArr(ALL_IDS.slice());
    state.idx = 0;
    ui.hold = null;
    save();
    render();
    toTop();
    toast(state.order === 'seq' ? '已切换为顺序练习' : '已切换为随机练习');
  }

  function step(d) {
    if (state.mode === 'short') { shortStep(d); return; }
    var ids = activeIds();
    if (!ids.length) return;
    var i = curIdx(ids);
    var n = Math.min(Math.max(i + d, 0), ids.length - 1);
    ui.hold = null;
    if (n === i) return;
    state.idx = n;
    save();
    render();
    toTop();
  }

  function jumpTo(i) {
    var ids = activeIds();
    if (i < 0 || i >= ids.length) return;
    ui.hold = null;
    state.idx = i;
    ui.sheet = null;
    save();
    render();
    toTop();
  }

  function chooseOption(orig) {
    var v = view();
    if (v !== 'quiz' && v !== 'examQuiz') return;
    var q = curQ();
    if (!q) return;

    if (state.mode === 'practice') {
      if (state.done[q.id]) { toast('本题已作答；如需重来，点顶部「重置答案」'); return; }
      if (q.type === 'multi') {
        var cur = (state.answers[q.id] || []).slice();
        var idx = cur.indexOf(orig);
        if (idx >= 0) cur.splice(idx, 1); else cur.push(orig);
        state.answers[q.id] = cur.sort(function (a, b) { return a - b; });
        save();
        render();
      } else {
        state.answers[q.id] = [orig];
        state.done[q.id] = true;
        var wasWrong = state.wrong.indexOf(q.id) >= 0;
        var ok = isCorrect(q, [orig]);
        bumpHist(q.id, ok);
        if (ok) { removeWrong(q.id); if (state.wrongOnly) ui.hold = q.id; }
        else addWrong(q.id);
        save();
        render();
        if (ok) toast(wasWrong ? '回答正确，已移出错题本' : '回答正确');
        else toast('回答错误，已加入错题本');
      }
    } else {
      var s = (state.exam.answers[q.id] || []).slice();
      if (q.type === 'multi') {
        var k = s.indexOf(orig);
        if (k >= 0) s.splice(k, 1); else s.push(orig);
        state.exam.answers[q.id] = s.sort(function (a, b) { return a - b; });
      } else {
        state.exam.answers[q.id] = [orig];
      }
      save();
      render();
    }
  }

  function confirmMulti() {
    var q = curQ();
    if (!q || q.type !== 'multi') return;
    if (state.done[q.id]) return;
    var sel = state.answers[q.id] || [];
    if (!sel.length) { toast('请先选择答案'); return; }
    state.done[q.id] = true;
    var ok = isCorrect(q, sel);
    bumpHist(q.id, ok);
    if (ok) { removeWrong(q.id); if (state.wrongOnly) ui.hold = q.id; }
    else addWrong(q.id);
    save();
    render();
    toast(ok ? '回答正确' : '回答错误，已加入错题本');
  }

  function startExam() {
    var ids = orderedIds(subjectIds());
    if (!ids.length) { toast('当前范围没有题目'); return; }
    state.exam = { ids: ids.slice(), answers: {}, phase: 'running' };
    state.mode = 'exam';
    state.idx = 0;
    state.wrongOnly = false;
    ui.hold = null;
    ui.sheet = null;
    save();
    render();
    toTop();
    toast('考试开始，共 ' + ids.length + ' 题');
  }

  function openSubmit() {
    if (!state.exam.ids.length) return;
    ui.sheet = 'submit';
    render();
  }

  function submitExam() {
    if (!state.exam.ids.length || state.exam.phase === 'result') return;
    state.exam.ids.forEach(function (id) {
      var q = QMAP.get(id);
      var s = state.exam.answers[id] || [];
      if (!s.length) return; // 未作答不计入作答统计与错题本
      var ok = isCorrect(q, s);
      bumpHist(id, ok);
      if (ok) removeWrong(id); else addWrong(id);
    });
    state.exam.phase = 'result';
    state.idx = 0;
    ui.hold = null;
    ui.sheet = null;
    save();
    render();
    toTop();
  }

  function enterReview() {
    if (!state.exam.ids.length) return;
    state.exam.phase = 'review';
    state.idx = 0;
    ui.hold = null;
    save();
    render();
    toTop();
  }

  function exitReview() {
    state.exam.phase = 'result';
    state.idx = 0;
    save();
    render();
    toTop();
  }

  /* ===================== 简答与速记 ===================== */
  function shortCur() {
    return SHORT_QA[Math.min(Math.max(state.shortIdx, 0), SHORT_QA.length - 1)];
  }
  function shortStep(d) {
    if (state.shortTab !== 'qa') return;
    var n = Math.min(Math.max(state.shortIdx + d, 0), SHORT_QA.length - 1);
    if (n === state.shortIdx) return;
    state.shortIdx = n;
    save();
    render();
    toTop();
  }
  function shortReveal() {
    var q = shortCur();
    if (!q) return;
    state.shortOpen[q.id] = true;
    save();
    render();
  }
  function shortHide() {
    var q = shortCur();
    if (!q) return;
    delete state.shortOpen[q.id];
    save();
    render();
  }
  function shortTab(t) {
    state.shortTab = t === 'num' ? 'num' : 'qa';
    save();
    render();
    toTop();
  }
  function numRowCount() {
    var n = 0;
    NUM_GROUPS.forEach(function (g) { n += g.rows.length; });
    return n;
  }
  function shortTabBar(tab) {
    return '<div class="tabs">' +
      '<button class="tab" data-act="qaTab" aria-pressed="' + (tab === 'qa') + '">简答题 ' + SHORT_QA.length + '</button>' +
      '<button class="tab" data-act="numTab" aria-pressed="' + (tab === 'num') + '">数字速记 ' + numRowCount() + '</button>' +
      '</div>';
  }
  function shortViewHtml() {
    var tab = state.shortTab === 'num' ? 'num' : 'qa';
    if (tab === 'num') return shortTabBar(tab) + numTableHtml();
    return shortTabBar(tab) + shortCardHtml(shortCur());
  }
  function shortCardHtml(q) {
    if (!q) return '<section class="card empty"><h2>暂无简答题</h2></section>';
    var i = Math.min(Math.max(state.shortIdx, 0), SHORT_QA.length - 1);
    var open = !!state.shortOpen[q.id];
    var points = q.points.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('');
    var answer = open
      ? '<div class="qaAns">' +
          '<div class="qaH">参考答案</div>' +
          '<ol class="qaOl">' + points + '</ol>' +
          '<div class="qaKey"><b>评分要点/易错点：</b>' + esc(q.key) + '</div>' +
          '<button class="revealBtn" data-act="shortHide">收起答案</button>' +
        '</div>'
      : '<button class="revealBtn" data-act="shortReveal">显示参考答案</button>';
    return '<section class="card qa">' +
      '<div class="meta"><span class="tag">' + esc(q.subject) + '</span><span class="tag t2">简答</span>' +
      '<span class="num">' + (i + 1) + '/' + SHORT_QA.length + '</span></div>' +
      '<div class="kicker">' + esc(q.title) + '</div>' +
      '<h2 class="stem">' + esc(q.stem) + '</h2>' +
      '<p class="hint">先自己按“关键词 + 分点”组织答案，再展开对照；考试作答时把关键数字和顺序写全。</p>' +
      answer +
      '</section>';
  }
  function numTableHtml() {
    return NUM_GROUPS.map(function (g) {
      var rows = g.rows.map(function (r) {
        return '<div class="nrow">' +
          '<div class="nc c1" data-l="项目">' + esc(r[0]) + '</div>' +
          '<div class="nc c2" data-l="数值">' + esc(r[1]) + '</div>' +
          '<div class="nc" data-l="适用条件">' + esc(r[2]) + '</div>' +
          '<div class="nc" data-l="易错提醒">' + esc(r[3]) + '</div>' +
          '</div>';
      }).join('');
      return '<section class="card ncard"><h3 class="ngh">' + esc(g.title) + '</h3>' +
        '<div class="ntable"><div class="nhead"><span>项目</span><span>数值</span><span>适用条件</span><span>易错提醒</span></div>' +
        rows + '</div></section>';
    }).join('');
  }

  function primaryAct() {
    if (state.mode === 'short') {
      if (state.shortTab === 'num') { shortTab('qa'); return; }
      var sq = shortCur();
      if (!state.shortOpen[sq.id]) { shortReveal(); return; }
      if (state.shortIdx >= SHORT_QA.length - 1) { toast('15 道简答已过完，可切到「数字速记」'); return; }
      shortStep(1);
      return;
    }
    var v = view();
    if (v === 'empty') { showAll(); return; }
    if (v === 'examIntro') { startExam(); return; }
    if (v === 'result') { enterReview(); return; }
    if (v === 'review') {
      var rIds = activeIds();
      if (curIdx(rIds) >= rIds.length - 1) exitReview(); else step(1);
      return;
    }
    var q = curQ();
    if (!q) return;
    if (state.mode === 'practice') {
      if (q.type === 'multi' && !state.done[q.id]) { confirmMulti(); return; }
      var ids = activeIds();
      if (curIdx(ids) >= ids.length - 1) { openStats(); toast('本轮已到最后一题'); return; }
      step(1);
    } else {
      var eIds = activeIds();
      if (curIdx(eIds) >= eIds.length - 1) openSubmit(); else step(1);
    }
  }

  function showAll() {
    state.subject = '全部';
    state.wrongOnly = false;
    state.idx = 0;
    ui.hold = null;
    save();
    render();
  }

  function openStats() {
    ui.sheet = 'stats';
    render();
  }
  function openSheet(kind) {
    ui.sheet = kind;
    render();
  }
  function closeSheet() {
    ui.sheet = null;
    render();
  }

  function doReset() {
    state.answers = {};
    state.done = {};
    state.hist = {};
    state.wrong = [];
    state.exam = { ids: [], answers: {}, phase: 'idle' };
    state.idx = 0;
    state.wrongOnly = false;
    state.shortOpen = {};
    state.shortIdx = 0;
    state.shortTab = 'qa';
    ui.hold = null;
    ui.sheet = null;
    ui.resetArm = false;
    ui.ansArm = false;
    clearTimeout(ui.ansTimer);
    save();
    render();
  }

  /* ===================== 渲染：顶部 ===================== */
  function renderTop() {
    var chips = document.getElementById('chips');
    var stats = document.getElementById('stats');
    var pfill = document.getElementById('pfill');
    var pbar = document.getElementById('pbar');
    var foldBtn = document.getElementById('foldBtn');
    var orderBtn = document.getElementById('orderBtn');

    stats.hidden = state.collapse;
    chips.hidden = state.collapse || state.mode !== 'practice';
    foldBtn.textContent = state.collapse ? '⌄' : '⌃';
    foldBtn.setAttribute('aria-expanded', state.collapse ? 'false' : 'true');
    orderBtn.textContent = state.order === 'seq' ? '顺序出题' : '随机出题';
    orderBtn.hidden = state.mode === 'short';

    var resetAnsBtn = document.getElementById('resetAnsBtn');
    resetAnsBtn.hidden = state.mode !== 'practice';
    resetAnsBtn.textContent = ui.ansArm ? '确认重置' : '重置答案';
    if (ui.ansArm) resetAnsBtn.classList.add('danger'); else resetAnsBtn.classList.remove('danger');
    var ansCount = 0;
    for (var ai = 0; ai < QUESTIONS.length; ai++) {
      var aq = QUESTIONS[ai];
      if (state.done[aq.id] || (state.answers[aq.id] || []).length) ansCount++;
    }
    resetAnsBtn.disabled = ansCount === 0;

    var segs = document.querySelectorAll('.seg button');
    for (var i = 0; i < segs.length; i++) {
      segs[i].setAttribute('aria-pressed', segs[i].getAttribute('data-mode') === state.mode ? 'true' : 'false');
    }

    var html = '';
    var pct = 0;
    var scopeIds;
    var v = view();

    if (state.mode === 'short') {
      var opened = 0;
      SHORT_QA.forEach(function (q) { if (state.shortOpen[q.id]) opened++; });
      if (state.shortTab === 'num') {
        pct = 0;
        html += '<div class="stat"><b>' + numRowCount() + '</b><span>速记条</span></div>';
        html += '<div class="stat"><b>' + NUM_GROUPS.length + '</b><span>分组</span></div>';
        html += '<div class="stat"><b>' + SHORT_QA.length + '</b><span>简答题</span></div>';
        html += '<button class="stat" data-act="qaTab"><b>去看</b><span>简答题</span></button>';
      } else {
        pct = SHORT_QA.length ? Math.round(opened / SHORT_QA.length * 100) : 0;
        html += '<div class="stat"><b>' + opened + '<i>/' + SHORT_QA.length + '</i></b><span>已展开</span></div>';
        html += '<div class="stat"><b>' + SHORT_QA.length + '</b><span>简答题</span></div>';
        html += '<div class="stat"><b>' + numRowCount() + '</b><span>速记条</span></div>';
        html += '<button class="stat" data-act="numTab"><b>去看</b><span>数字速记</span></button>';
      }
    } else if (state.mode === 'exam' && (v === 'result' || v === 'review' || v === 'examQuiz')) {
      var st = examStats();
      var doneN = st.c + st.w;
      pct = st.n ? Math.round(doneN / st.n * 100) : 0;
      if (v === 'result' || v === 'review') {
        html += '<div class="stat"><b>' + st.score + '</b><span>得分</span></div>';
        html += '<div class="stat"><b>' + st.c + '</b><span>正确</span></div>';
        html += '<div class="stat"><b>' + st.w + '</b><span>错误</span></div>';
        html += '<div class="stat"><b>' + st.b + '</b><span>未答</span></div>';
      } else {
        html += '<div class="stat"><b>' + doneN + '<i>/' + st.n + '</i></b><span>已答</span></div>';
        html += '<div class="stat"><b>' + (st.n - doneN) + '</b><span>未答</span></div>';
        html += '<div class="stat"><b>' + st.n + '</b><span>共题</span></div>';
        html += '<button class="stat" data-act="card"><b>跳转</b><span>答题卡</span></button>';
      }
    } else if (state.mode === 'exam' && v === 'examIntro') {
      scopeIds = subjectIds();
      var practiced = 0, wrongIntro = 0;
      scopeIds.forEach(function (id) {
        if (state.done[id]) practiced++;
        if (state.wrong.indexOf(id) >= 0) wrongIntro++;
      });
      pct = 0;
      html += '<div class="stat"><b>' + scopeIds.length + '</b><span>本次题量</span></div>';
      html += '<div class="stat"><b>' + practiced + '</b><span>已练</span></div>';
      html += '<div class="stat"><b>' + wrongIntro + '</b><span>错题</span></div>';
      html += '<button class="stat" data-act="stats"><b>查看</b><span>备考数据</span></button>';
    } else {
      scopeIds = subjectIds();
      var answered = 0, correct = 0, wrongN = 0;
      scopeIds.forEach(function (id) {
        if (state.done[id]) {
          answered++;
          if (isCorrect(QMAP.get(id), state.answers[id] || [])) correct++;
        }
        if (state.wrong.indexOf(id) >= 0) wrongN++;
      });
      pct = scopeIds.length ? Math.round(answered / scopeIds.length * 100) : 0;
      var rate = answered ? Math.round(correct / answered * 100) : null;
      html += '<div class="stat"><b>' + answered + '<i>/' + scopeIds.length + '</i></b><span>已答</span></div>';
      html += '<div class="stat"><b>' + correct + '</b><span>正确</span></div>';
      html += '<div class="stat"><b>' + wrongN + '</b><span>错题</span></div>';
      html += '<button class="stat" data-act="stats"><b>' + (rate === null ? '—' : rate + '%') + '</b><span>正确率</span></button>';
    }

    stats.innerHTML = html;
    pfill.style.width = Math.max(0, Math.min(100, pct)) + '%';
    pbar.setAttribute('aria-valuenow', String(pct));

    if (chips.hidden) { chips.innerHTML = ''; return; }
    var cHtml = '<button class="chip" data-subject="全部" aria-pressed="' + (state.subject === '全部') + '">全部 <small>' + TOTAL + '</small></button>';
    SUBJECTS.forEach(function (sub) {
      var n = QUESTIONS.filter(function (q) { return q.subject === sub; }).length;
      cHtml += '<button class="chip" data-subject="' + esc(sub) + '" aria-pressed="' + (state.subject === sub) + '">' + esc(sub) + ' <small>' + n + '</small></button>';
    });
    cHtml += '<button class="chip wrongchip" data-act="wrongOnly" aria-pressed="' + state.wrongOnly + '">只看错题 <small>' + state.wrong.length + '</small></button>';
    chips.innerHTML = cHtml;
  }

  /* ===================== 渲染：题卡 ===================== */
  function optionHtml(q, perm, sel, reveal, locked) {
    return perm.map(function (orig, pos) {
      var isSel = sel.indexOf(orig) >= 0;
      var isAns = q.answer.indexOf(orig) >= 0;
      var cls = 'opt';
      var mark = '';
      if (isSel) cls += ' sel';
      if (reveal) {
        if (isAns) { cls += ' ok'; mark = '<span class="mk">✓</span>'; }
        else if (isSel) { cls += ' bad'; mark = '<span class="mk">✗</span>'; }
        else cls += ' dim';
      }
      return '<button type="button" class="' + cls + '" data-opt="' + orig + '"' +
        (locked ? ' aria-disabled="true"' : '') + '>' +
        '<span class="lt">' + LETTERS.charAt(pos) + '</span>' +
        '<span class="ot">' + esc(q.options[orig]) + '</span>' + mark +
        '</button>';
    }).join('');
  }

  function explainHtml(q, perm, sel, ok) {
    var head;
    if (!sel.length) head = '未作答 · 正确答案：' + answerText(q, perm);
    else head = (ok ? '✓ 回答正确' : '✗ 回答错误') + ' · 正确答案：' + answerText(q, perm);
    return '<div class="exp ' + (ok ? 'ok' : 'bad') + '">' +
      '<div class="eh">' + head + '</div>' +
      '<div class="eb">' + esc(q.explain) + '</div>' +
      '</div>';
  }

  function quizCard(q, ids, i, kind) {
    var perm = permFor(q);
    var sel = kind === 'practice' ? (state.answers[q.id] || []) : (state.exam.answers[q.id] || []);
    var done = kind === 'practice' && !!state.done[q.id];
    var reveal = kind === 'practice' ? done : kind === 'review';
    var ok = isCorrect(q, sel);
    var locked = kind === 'practice' && done;

    var meta = '<span class="tag">' + esc(q.subject) + '</span>' +
      '<span class="tag t2">' + TYPE_LABEL[q.type] + '</span>';

    if (kind === 'review') {
      meta += '<span class="state ' + (sel.length === 0 ? '' : ok ? 'ok' : 'bad') + '">' +
        (sel.length === 0 ? '未作答' : ok ? '回答正确' : '回答错误') + '</span>';
    }
    if (kind === 'exam' || kind === 'review') {
      meta += '<button class="minibtn" data-act="card">答题卡</button>';
    }
    var remain = ids.length - i - 1;
    meta += '<span class="num">' + (i + 1) + '/' + ids.length + (kind === 'review' ? '' : ' · 余 ' + remain) + '</span>';

    var hint = '';
    if (kind === 'practice' && q.type === 'multi' && !done) {
      hint = '<p class="hint">多选题：可选多个选项，选好后点下方「确认答案」提交。</p>';
    }

    return '<section class="card">' +
      '<div class="meta">' + meta + '</div>' +
      '<h2 class="stem">' + esc(q.stem) + '</h2>' +
      '<div class="opts" role="group" aria-label="选项">' + optionHtml(q, perm, sel, reveal, locked) + '</div>' +
      hint +
      (reveal ? explainHtml(q, perm, sel, ok) : '') +
      '</section>';
  }

  function emptyHtml() {
    var t = state.wrongOnly ? '错题本还是空的' : '这个范围暂时没有题目';
    var p = state.wrongOnly
      ? '还没有做错的题，继续保持。也可以回到全部题目，再多练几道。'
      : '换一个科目，或回到全部题目看看。';
    return '<section class="card empty">' +
      '<div class="emo" aria-hidden="true">◎</div>' +
      '<h2>' + t + '</h2><p>' + p + '</p></section>';
  }

  function introHtml() {
    var n = orderedIds(subjectIds()).length;
    var scope = state.subject === '全部' ? '全部科目' : state.subject;
    return '<section class="card intro">' +
      '<div class="kicker">考试模式</div>' +
      '<h2>一次完成 ' + n + ' 题</h2>' +
      '<p>本次范围：' + esc(scope) + '。作答过程不显示对错，可随时通过答题卡跳转，最后一题或点「交卷」提交。</p>' +
      '<ul>' +
      '<li>交卷后给出得分、正确率与分档评语</li>' +
      '<li>答错的题自动进入错题本，答对则移出</li>' +
      '<li>答案实时保存，刷新或重开浏览器都不会丢</li>' +
      '</ul></section>';
  }

  function resultHtml() {
    var st = examStats();
    var pct = st.score;
    var verdict = pct >= 90 ? '稳了，保持手感'
      : pct >= 75 ? '不错，重点补错题'
      : pct >= 60 ? '基础尚可，错题再过一遍'
      : '需要突击，先看逐题解析';
    var scope = state.subject === '全部' ? '全部科目' : state.subject;
    return '<section class="card result">' +
      '<div class="score"><span class="big">' + pct + '</span><span class="unit">分</span></div>' +
      '<div class="verdict">' + verdict + '</div>' +
      '<div class="rline">正确率 ' + pct + '% · 正确 ' + st.c + ' 题 · 错误 ' + st.w + ' 题 · 未答 ' + st.b + ' 题</div>' +
      '<div class="rbar"><i style="width:' + pct + '%"></i></div>' +
      '<div class="rsub">范围：' + esc(scope) + ' · 共 ' + st.n + ' 题</div>' +
      '</section>';
  }

  function renderMain() {
    var z = document.getElementById('qzone');
    var v = view();
    if (v === 'short') { z.innerHTML = shortViewHtml(); return; }
    if (v === 'empty') { z.innerHTML = emptyHtml(); return; }
    if (v === 'examIntro') { z.innerHTML = introHtml(); return; }
    if (v === 'result') { z.innerHTML = resultHtml(); return; }

    var ids = activeIds();
    var i = curIdx(ids);
    var q = QMAP.get(ids[i]);
    if (!q) { z.innerHTML = emptyHtml(); return; }
    var kind = v === 'review' ? 'review' : (state.mode === 'exam' ? 'exam' : 'practice');
    z.innerHTML = quizCard(q, ids, i, kind);
  }

  /* ===================== 渲染：底部操作条 ===================== */
  function dockHtml() {
    var v = view();
    if (v === 'empty') {
      return '<button class="btn primary" data-act="all">回到全部题目</button>';
    }
    if (v === 'examIntro') {
      return '<button class="btn primary" data-act="startExam">开始考试 · ' + orderedIds(subjectIds()).length + ' 题</button>';
    }
    if (v === 'result') {
      return '<button class="btn ghost" data-act="retry">再考一次</button>' +
        '<button class="btn primary" data-act="review">逐题查看解析</button>';
    }
    if (v === 'short') {
      if (state.shortTab === 'num') {
        return '<button class="btn primary" data-act="qaTab">回到简答题</button>';
      }
      var sq = shortCur();
      var sOpen = !!state.shortOpen[sq.id];
      var sFirst = state.shortIdx <= 0;
      var sLast = state.shortIdx >= SHORT_QA.length - 1;
      var sPrev = '<button class="btn ghost" data-act="shortPrev"' + (sFirst ? ' disabled' : '') + '>上一题</button>';
      if (!sOpen) return sPrev + '<button class="btn primary" data-act="shortReveal">显示参考答案</button>';
      return sPrev + '<button class="btn primary" data-act="' + (sLast ? 'shortEnd' : 'shortNext') + '">' + (sLast ? '完成' : '下一题') + '</button>';
    }

    var ids = activeIds();
    var i = curIdx(ids);
    var atFirst = i <= 0;
    var atLast = i >= ids.length - 1;
    var prevBtn = '<button class="btn ghost" data-act="prev"' + (atFirst ? ' disabled' : '') + '>上一题</button>';

    if (v === 'review') {
      return prevBtn + '<button class="btn primary" data-act="' + (atLast ? 'exitReview' : 'next') + '">' +
        (atLast ? '退出查阅' : '下一题') + '</button>';
    }

    if (state.mode === 'practice') {
      var q = curQ();
      var multi = q && q.type === 'multi' && !state.done[q.id];
      var label = multi ? '确认答案' : (atLast ? '完成本轮' : '下一题');
      var act = multi ? 'confirm' : (atLast ? 'finish' : 'next');
      return prevBtn + '<button class="btn primary" data-act="' + act + '">' + label + '</button>';
    }

    if (atLast) {
      return prevBtn + '<button class="btn primary" data-act="submit-open">交卷</button>';
    }
    return prevBtn +
      '<button class="btn ghost" data-act="submit-open">交卷</button>' +
      '<button class="btn primary" data-act="next">下一题</button>';
  }

  function renderDock() {
    document.getElementById('dock').innerHTML = dockHtml();
  }

  /* ===================== 渲染：侧栏与弹层 ===================== */
  function subjectRowsHtml() {
    return SUBJECTS.map(function (sub) {
      var s = subjectStats(sub);
      var pct = s.pct === null ? 0 : s.pct;
      return '<div class="srow">' +
        '<div class="st"><span>' + esc(sub) + '</span><span class="sp">' + (s.pct === null ? '—' : s.pct + '%') + '</span></div>' +
        '<div class="sbar"><i style="width:' + pct + '%"></i></div>' +
        '<div class="sm">作答 ' + s.t + ' 次 · 练习已答 ' + s.done + '/' + s.total + '</div>' +
        '</div>';
    }).join('');
  }

  function renderRail() {
    var rail = document.getElementById('rail');
    if (!rail) return;
    var answeredAll = 0;
    QUESTIONS.forEach(function (q) { if (state.done[q.id]) answeredAll++; });
    rail.innerHTML = '<div class="sticky">' +
      '<div class="railcard"><h3>各科正确率</h3>' + subjectRowsHtml() + '</div>' +
      '<div class="railcard"><h3>本机数据</h3>' +
      '<p class="sl" style="font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:10px">题库 ' + TOTAL + ' 题 · 已答 ' + answeredAll + ' 题 · 错题 ' + state.wrong.length + ' 道</p>' +
      '<button class="mini wide" data-act="stats">查看完整数据</button></div>' +
      '<p class="foot">单文件 · 零外链 · 断网可用；进度只保存在本机浏览器。</p>' +
      '</div>';
  }

  function statsSheetHtml() {
    var answered = 0, correct = 0;
    QUESTIONS.forEach(function (q) {
      if (state.done[q.id]) {
        answered++;
        if (isCorrect(q, state.answers[q.id] || [])) correct++;
      }
    });
    var rate = answered ? Math.round(correct / answered * 100) : null;
    var body = '<div class="overview">' +
      '<div class="ov"><b>' + answered + '</b><span>已答</span></div>' +
      '<div class="ov"><b>' + correct + '</b><span>正确</span></div>' +
      '<div class="ov"><b>' + (rate === null ? '—' : rate + '%') + '</b><span>正确率</span></div>' +
      '<div class="ov"><b>' + state.wrong.length + '</b><span>错题</span></div>' +
      '</div>' +
      '<h3 style="font-size:14px;margin-bottom:4px">各科正确率</h3>' +
      subjectRowsHtml() +
      '<h3 style="font-size:14px;margin:14px 0 6px">练习设置</h3>' +
      '<button class="mini wide" data-act="order">出题顺序：' + (state.order === 'seq' ? '顺序' : '随机') + '（点击切换）</button>' +
      '<div class="pactions">' +
      '<button class="mini wide" data-act="clearWrong"' + (state.wrong.length ? '' : ' disabled') + '>清空错题本（' + state.wrong.length + '）</button>' +
      '<button class="mini wide danger" data-act="reset">' + (ui.resetArm ? '再点一次确认清空' : '重置全部进度') + '</button>' +
      '</div>' +
      '<p class="note">正确率按历史作答次数统计；错题答对后会自动移出。重置会清空作答、错题、考试记录与简答阅读进度。</p>';
    return body;
  }

  function cardSheetHtml() {
    var cells = state.exam.ids.map(function (id, i) {
      var s = state.exam.answers[id] || [];
      var cls = 'cell' + (i === curIdx(state.exam.ids) ? ' cur' : '') + (s.length ? ' ans' : '');
      return '<button class="' + cls + '" data-act="jump" data-i="' + i + '">' + (i + 1) + '</button>';
    }).join('');
    return '<div class="legend"><span class="lg cur"></span>当前<span class="lg ans"></span>已答</div>' +
      '<div class="grid">' + cells + '</div>' +
      '<p class="note">共 ' + state.exam.ids.length + ' 题，已答 ' + (examStats().c + examStats().w) + ' 题。</p>';
  }

  function submitSheetHtml() {
    var st = examStats();
    return '<p class="sheetp">本次共 ' + st.n + ' 题，已答 ' + (st.c + st.w) + ' 题，还有 ' + st.b + ' 题未作答。未答按错处理，交卷后不能修改答案。</p>' +
      '<div class="pactions" style="flex-direction:row">' +
      '<button class="btn ghost" style="flex:1" data-act="close">继续答题</button>' +
      '<button class="btn primary" style="flex:1" data-act="doSubmit">确认交卷</button>' +
      '</div>';
  }

  function renderSheet() {
    var root = document.getElementById('sheetRoot');
    if (!ui.sheet) {
      root.innerHTML = '';
      document.body.style.overflow = '';
      return;
    }
    document.body.style.overflow = 'hidden';
    var title = '';
    var body = '';
    if (ui.sheet === 'stats') { title = '备考数据'; body = statsSheetHtml(); }
    else if (ui.sheet === 'card') { title = '答题卡'; body = cardSheetHtml(); }
    else if (ui.sheet === 'submit') { title = '确认交卷'; body = submitSheetHtml(); }
    else if (ui.sheet === 'clearWrong') {
      title = '清空错题本';
      body = '<p class="sheetp">将移除 ' + state.wrong.length + ' 道错题记录，已作答的练习进度不受影响。</p>' +
        '<div class="pactions" style="flex-direction:row">' +
        '<button class="btn ghost" style="flex:1" data-act="close">取消</button>' +
        '<button class="btn primary" style="flex:1" data-act="doClearWrong">确认清空</button></div>';
    } else if (ui.sheet === 'retry') {
      title = '重新开始考试';
      body = '<p class="sheetp">将清空本场作答并重新抽题，之前的得分不再保留。</p>' +
        '<div class="pactions" style="flex-direction:row">' +
        '<button class="btn ghost" style="flex:1" data-act="close">取消</button>' +
        '<button class="btn primary" style="flex:1" data-act="doRetry">重新开始</button></div>';
    }
    root.innerHTML = '<div class="sheet"><div class="mask"></div>' +
      '<div class="panel" role="dialog" aria-modal="true" aria-label="' + title + '">' +
      '<div class="phead"><h3>' + title + '</h3><button class="closebtn" data-act="close">关闭</button></div>' +
      body + '</div></div>';
  }

  function render() {
    try {
      document.body.setAttribute('data-appmode', state.mode);
      renderTop();
      renderMain();
      renderDock();
      renderRail();
      renderSheet();
    } catch (e) {
      fatal(e && e.message ? e.message : String(e));
    }
  }

  /* ===================== 事件 ===================== */
  function handleAct(act, el) {
    switch (act) {
      case 'fold':
        state.collapse = !state.collapse;
        save();
        render();
        break;
      case 'order':
        setOrder();
        break;
      case 'stats':
        openStats();
        break;
      case 'all':
        showAll();
        break;
      case 'wrongOnly':
        state.wrongOnly = !state.wrongOnly;
        state.idx = 0;
        ui.hold = null;
        // 进入错题本时重新开放作答：否则练习模式的“已答锁定”会让错题永远无法答对移出
        if (state.wrongOnly) {
          state.wrong.forEach(function (id) {
            delete state.done[id];
            delete state.answers[id];
          });
        }
        if (state.wrongOnly && !currentIds().length) toast('还没有错题，继续加油！');
        else if (state.wrongOnly) toast('错题已重新开放作答，答对后自动移出');
        save();
        render();
        toTop();
        break;
      case 'prev':
        step(-1);
        break;
      case 'next':
        step(1);
        break;
      case 'finish':
        openStats();
        toast('本轮已到最后一题');
        break;
      case 'confirm':
        confirmMulti();
        break;
      case 'startExam':
        startExam();
        break;
      case 'retry':
        openSheet('retry');
        break;
      case 'doRetry':
        startExam();
        break;
      case 'review':
        enterReview();
        break;
      case 'exitReview':
        exitReview();
        break;
      case 'submit-open':
        openSubmit();
        break;
      case 'doSubmit':
        submitExam();
        toast('已交卷');
        break;
      case 'card':
        openSheet('card');
        break;
      case 'jump':
        jumpTo(Number(el.getAttribute('data-i')));
        break;
      case 'close':
        closeSheet();
        break;
      case 'reset':
        if (!ui.resetArm) {
          ui.resetArm = true;
          clearTimeout(ui.resetTimer);
          ui.resetTimer = window.setTimeout(function () {
            ui.resetArm = false;
            render();
          }, 3000);
          render();
          toast('再点一次即可清空全部作答与错题');
        } else {
          clearTimeout(ui.resetTimer);
          doReset();
          toast('已重置，作答与错题已全部清空');
        }
        break;
      case 'clearWrong':
        if (!state.wrong.length) { toast('错题本已经是空的'); return; }
        openSheet('clearWrong');
        break;
      case 'doClearWrong':
        state.wrong = [];
        ui.hold = null;
        ui.sheet = null;
        save();
        render();
        toast('错题本已清空');
        break;
      case 'resetAnswers':
        if (!ui.ansArm) {
          ui.ansArm = true;
          clearTimeout(ui.ansTimer);
          ui.ansTimer = window.setTimeout(function () {
            ui.ansArm = false;
            render();
          }, 3000);
          render();
          toast('再点一次确认：清空全部练习答案（错题本保留）');
        } else {
          clearTimeout(ui.ansTimer);
          ui.ansArm = false;
          state.answers = {};
          state.done = {};
          state.hist = {};
          state.idx = 0;
          state.wrongOnly = false;
          ui.hold = null;
          save();
          render();
          toTop();
          toast('已清空全部练习答案，错题本保留');
        }
        break;
      case 'qaTab':
        shortTab('qa');
        break;
      case 'numTab':
        shortTab('num');
        break;
      case 'shortPrev':
        shortStep(-1);
        break;
      case 'shortNext':
        shortStep(1);
        break;
      case 'shortReveal':
        shortReveal();
        break;
      case 'shortHide':
        shortHide();
        break;
      case 'shortEnd':
        toast('15 道简答已过完，可切到「数字速记」');
        break;
      default:
        break;
    }
  }

  document.addEventListener('click', function (e) {
    var sheetEl = e.target.closest ? e.target.closest('.sheet') : null;
    if (sheetEl && !e.target.closest('.panel')) { closeSheet(); return; }

    var optEl = e.target.closest ? e.target.closest('[data-opt]') : null;
    if (optEl) { chooseOption(Number(optEl.getAttribute('data-opt'))); return; }

    var subEl = e.target.closest ? e.target.closest('[data-subject]') : null;
    if (subEl) { setSubject(subEl.getAttribute('data-subject')); return; }

    var modeEl = e.target.closest ? e.target.closest('[data-mode]') : null;
    if (modeEl) { setMode(modeEl.getAttribute('data-mode')); return; }

    var actEl = e.target.closest ? e.target.closest('[data-act]') : null;
    if (actEl) { handleAct(actEl.getAttribute('data-act'), actEl); }
  });

  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (ui.sheet) {
      if (e.key === 'Escape') { e.preventDefault(); closeSheet(); }
      return;
    }
    var v = view();
    if (v === 'short') {
      if (e.key === 'Enter') { e.preventDefault(); primaryAct(); return; }
      if (e.key === 'ArrowRight') { e.preventDefault(); shortStep(1); return; }
      if (e.key === 'ArrowLeft') { e.preventDefault(); shortStep(-1); }
      return;
    }
    if (v !== 'quiz' && v !== 'examQuiz') {
      if (e.key === 'Enter') { e.preventDefault(); primaryAct(); }
      return;
    }
    var key = e.key;
    var pos = -1;
    if (/^[a-eA-E]$/.test(key)) pos = key.toUpperCase().charCodeAt(0) - 65;
    else if (/^[1-5]$/.test(key)) pos = Number(key) - 1;

    if (pos >= 0) {
      var q = curQ();
      if (!q) return;
      var perm = permFor(q);
      if (pos < perm.length) {
        e.preventDefault();
        chooseOption(perm[pos]);
      }
      return;
    }
    if (key === 'Enter') { e.preventDefault(); primaryAct(); return; }
    if (key === 'ArrowRight') { e.preventDefault(); step(1); return; }
    if (key === 'ArrowLeft') { e.preventDefault(); step(-1); }
  });

  window.addEventListener('error', function (ev) {
    if (ev && ev.message) fatal(ev.message);
  });

  /* ===================== 启动 ===================== */
  try {
    load();
    if (!QUESTIONS.length) throw new Error('题库为空');
    render();
  } catch (e) {
    fatal(e && e.message ? e.message : String(e));
    var z = document.getElementById('qzone');
    if (z) {
      z.innerHTML = '<div class="fatal">初始化失败：' + esc(e && e.message ? e.message : '未知错误') +
        '。请刷新页面重试；若使用无痕模式或禁用了本地存储，进度将无法保存。</div>';
    }
  }
})();
</script>
</body>
</html>
